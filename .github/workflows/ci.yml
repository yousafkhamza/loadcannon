name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: embedded examples in sync with scenarios/
        run: diff -rq scenarios/ internal/examples/data/ || (echo "run 'make sync-examples' and commit the result" && exit 1)

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: sanity-check generated k6 script is valid JS
        run: |
          go build -o /tmp/loadcannon ./cmd/loadcannon
          LOADTEST_TOKEN=dummy /tmp/loadcannon gen-k6 --scenario scenarios/example-internal-direct-ip.json -o /tmp/script.js
          node --check /tmp/script.js
